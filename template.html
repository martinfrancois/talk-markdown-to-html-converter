<!DOCTYPE html>
<html lang=en data-color-mode=light data-light-theme=light_high_contrast>
<head>
    <meta charset=utf-8>
    <meta name=viewport content="width=device-width">
    <title>Code</title>

    <style id="layout-styles">
        .code-body {
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
            padding: 32px;
        }

        .qr-hover-zone {
            position: fixed;
            top: 0;
            right: 0;
            width: 20px;
            height: 20px;
            z-index: 10000;
        }

        .qr-floating {
            position: fixed;
            top: 12px;
            right: 12px;
            width: var(--qr-size, 128px);
            height: var(--qr-size, 128px);
            padding: 8px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            background: #ffffff;
            box-shadow: 0 8px 24px rgba(140, 149, 159, 0.2);
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-4px);
            transition: opacity 120ms ease, transform 120ms ease;
            z-index: 10001;
        }

        .qr-hover-zone:hover .qr-floating,
        .qr-hover-zone.qr-visible .qr-floating {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .qr-floating img {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .qr-resize-handle {
            position: absolute;
            left: -10px;
            bottom: -10px;
            width: 24px;
            height: 24px;
            cursor: nesw-resize;
        }
    </style>

</head>
<body style="overflow-wrap:break-word;padding:0 16px 40px;">
<div class="qr-hover-zone" id="qr-hover-zone" aria-label="QR code controls">
    <div class="qr-floating" id="qr-floating" role="button" tabindex="0" title="Click to change QR code URL">
        <img id="qr-image" alt="QR code">
        <div class="qr-resize-handle" id="qr-resize-handle" aria-hidden="true"></div>
    </div>
</div>
<div class="code-body js-snippet-clipboard-copy-unpositioned">
    <article class="markdown-body entry-content container-lg" itemprop=text>
        <!-- content injected -->
    </article>
</div>
<script>
    (() => {
        const DEFAULT_QR_URL = window.location.href;
        const DEFAULT_QR_SIZE = 128;
        const MIN_QR_SIZE = 72;
        const MAX_QR_SIZE = 360;
        const storagePrefix = "talkMarkdownQr.";
        const zone = document.getElementById("qr-hover-zone");
        const qr = document.getElementById("qr-floating");
        const image = document.getElementById("qr-image");
        const handle = document.getElementById("qr-resize-handle");

        let qrUrl = localStorage.getItem(`${storagePrefix}url`) || DEFAULT_QR_URL;
        let qrSize = Number(localStorage.getItem(`${storagePrefix}size`)) || DEFAULT_QR_SIZE;
        let isResizing = false;

        const clampSize = (size) => Math.min(MAX_QR_SIZE, Math.max(MIN_QR_SIZE, size));

        const renderQr = () => {
            qrSize = clampSize(qrSize);
            qr.style.setProperty("--qr-size", `${qrSize}px`);
            image.src = `https://api.qrserver.com/v1/create-qr-code/?size=${Math.round(qrSize * 2)}x${Math.round(qrSize * 2)}&data=${encodeURIComponent(qrUrl)}`;
        };

        const editQrUrl = () => {
            const nextUrl = window.prompt("QR code URL", qrUrl);
            if (nextUrl === null) return;

            const trimmedUrl = nextUrl.trim();
            if (!trimmedUrl) return;

            qrUrl = trimmedUrl;
            localStorage.setItem(`${storagePrefix}url`, qrUrl);
            renderQr();
        };

        qr.addEventListener("click", (event) => {
            if (event.target === handle || isResizing) return;
            editQrUrl();
        });

        qr.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                editQrUrl();
            }
        });

        handle.addEventListener("pointerdown", (event) => {
            event.preventDefault();
            event.stopPropagation();
            isResizing = true;
            zone.classList.add("qr-visible");
            handle.setPointerCapture(event.pointerId);
        });

        handle.addEventListener("pointermove", (event) => {
            if (!isResizing) return;

            const rect = qr.getBoundingClientRect();
            qrSize = clampSize(rect.right - event.clientX);
            localStorage.setItem(`${storagePrefix}size`, String(Math.round(qrSize)));
            renderQr();
        });

        const stopResize = (event) => {
            if (!isResizing) return;
            isResizing = false;
            zone.classList.remove("qr-visible");
            try {
                handle.releasePointerCapture(event.pointerId);
            } catch (_) {
                // Pointer capture may already be released by the browser.
            }
        };

        handle.addEventListener("pointerup", stopResize);
        handle.addEventListener("pointercancel", stopResize);

        renderQr();
    })();
</script>
</body>
</html>
